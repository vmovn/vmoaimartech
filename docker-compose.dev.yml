# Development compose — hot reload via Vite.
# Usage:  docker compose -f docker-compose.dev.yml up
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 8080
    env_file:
      - .env.development
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.output
    command: sh -c "(bun install || npm install) && npm run dev -- --host 0.0.0.0 --port 8080"
