# Swiffer reverse proxy — HTTP → HTTPS, TLS termination, security headers.
# Certs expected at /etc/nginx/certs/fullchain.pem and privkey.pem
# (mounted from ./deploy/certs — use certbot, cert-manager, or your CA).
#
# Legacy hostname redirects (Swiffer → Swiffer): permanent 301 redirects preserve
# path + query so existing bookmarks, deep links, docs URLs, API base URLs, and
# CDN references keep working. Point the following DNS records at this proxy:
#   *.swiffer.app  → swiffer.app equivalents
#   *.swiffer.com  → swiffer.com equivalents
#   *.swiffer.io   → swiffer.io equivalents
#   *.swiffer.dev  → swiffer.dev equivalents

map $host $swiffer_redirect_host {
    default                 "";
    "~^(?<sub>.+)\.swiffer\.app$"  "$sub.swiffer.app";
    "swiffer.app"            "swiffer.app";
    "~^(?<sub>.+)\.swiffer\.com$"  "$sub.swiffer.com";
    "swiffer.com"            "swiffer.com";
    "~^(?<sub>.+)\.swiffer\.io$"   "$sub.swiffer.io";
    "swiffer.io"             "swiffer.io";
    "~^(?<sub>.+)\.swiffer\.dev$"  "$sub.swiffer.dev";
    "swiffer.dev"            "swiffer.dev";
}

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name
        .swiffer.app
        .swiffer.com
        .swiffer.io
        .swiffer.dev;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # 301 preserves method for GET/HEAD and keeps path + query intact.
    return 301 https://$swiffer_redirect_host$request_uri;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # ACME HTTP-01 challenge
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    # Loadbalancer health probe (no redirect)
    location = /healthz { return 200 "ok\n"; add_header Content-Type text/plain; }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling        on;
    ssl_stapling_verify on;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(self), geolocation=(self)" always;

    # Health / readiness — bypass rate limits, no logging noise
    location = /healthz { access_log off; return 200 "ok\n"; add_header Content-Type text/plain; }
    location = /api/public/health       { access_log off; proxy_pass http://swiffer_app; }
    location = /api/public/health/ready  { access_log off; proxy_pass http://swiffer_app; }

    # Auth routes — stricter throttling
    location ~ ^/(auth|api/public/oauth) {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://swiffer_app;
        include /etc/nginx/conf.d/proxy_params.inc;
    }

    # API
    location /api/ {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://swiffer_app;
        include /etc/nginx/conf.d/proxy_params.inc;
    }

    # Static assets — long cache
    location ~* \.(js|css|woff2?|ttf|otf|svg|png|jpg|jpeg|gif|webp|avif|ico|map)$ {
        proxy_pass http://swiffer_app;
        proxy_cache_valid 200 30d;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Everything else → SSR
    location / {
        proxy_pass http://swiffer_app;
        include /etc/nginx/conf.d/proxy_params.inc;
    }
}
