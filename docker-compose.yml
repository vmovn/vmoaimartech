# Swiffer — production compose stack.
# Bring up with:  docker compose --env-file .env.production up -d
# Scale app:      docker compose up -d --scale app=4
# Requires: .env.production with VITE_*, SUPABASE_*, LOVABLE_API_KEY, session secret, etc.

x-app-env: &app-env
  NODE_ENV: production
  PORT: 3000
  HOST: 0.0.0.0
  VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
  VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
  SUPABASE_URL: ${SUPABASE_URL}
  SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY}
  SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
  LOVABLE_API_KEY: ${LOVABLE_API_KEY}
  SESSION_SECRET: ${SESSION_SECRET}
  WEBHOOK_SECRET: ${WEBHOOK_SECRET}
  WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET}
  WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN}
  APP_ORIGIN: ${APP_ORIGIN}
  LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  app:
    image: swiffer/app:${SWIFFER_VERSION:-4.4.6}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
        VITE_APP_ENV: production
        APP_VERSION: ${SWIFFER_VERSION:-4.4.6}
    environment: *app-env
    env_file:
      - .env.production
    restart: unless-stopped
    expose:
      - "3000"
    deploy:
      replicas: ${APP_REPLICAS:-2}
      resources:
        limits:
          cpus: "1.5"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M
      restart_policy:
        condition: on-failure
        max_attempts: 5
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/public/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks:
      - swiffer-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./deploy/certs:/etc/nginx/certs:ro
      - nginx-cache:/var/cache/nginx
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - swiffer-net

networks:
  swiffer-net:
    driver: bridge

volumes:
  nginx-cache:
